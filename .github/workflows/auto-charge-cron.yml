name: Auto Charge (Autopay)

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call auto charge endpoint
        run: |
          curl -f -X GET https://friendlypartyrentalsc.com/api/cron/auto-charge -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
