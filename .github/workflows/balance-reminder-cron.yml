name: Balance Reminders

on:
  schedule:
    - cron: '5 13 * * *'
  workflow_dispatch: {}

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call balance reminder endpoint
        run: |\n          curl -f -X GET https://www.friendlypartyrentalsc.com/api/cron/balance-reminder -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
