name: Balance Reminders

on:
  schedule:
    - cron: '5 13 * * *'
  workflow_dispatch: {}

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call balance reminder endpoint
        run: |
          curl -f -X GET https://fpr-nyc-production.up.railway.app/api/cron/balance-reminder -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
