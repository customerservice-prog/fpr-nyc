name: NYC Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - rebuild/nyc-full-location

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      PUBLIC_INDEXABLE: 'false'
      NYC_DELIVERY_FEES_JSON: '{}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: NYC location isolation guard
        run: npm run test:nyc-isolation

      - name: NYC business-contact consistency
        run: node --test tests/nyc-business-contact-consistency.test.cjs

      - name: NYC tracking isolation
        run: node --test tests/nyc-tracking-isolation.test.cjs

      - name: NYC marketing automation localization
        run: node --test tests/nyc-marketing-autopilot-parity.test.cjs

      - name: NYC delivery-only policy and quote regressions
        run: node --test tests/nyc-delivery.test.cjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
