name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy value so Prisma schema validation passes at build time.
      # No real database is contacted: public pages are force-dynamic and
      # only query the DB at request time, not during next build.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Test SC tracking destination isolation
        run: node --test tests/sc-tracking-isolation.test.cjs

      - name: Test Greenville delivery-only policy and quote regressions
        run: node --experimental-strip-types --test tests/sc-delivery.test.mjs

      - name: Build
        run: npm run build

      - name: Verify live Greenville delivery endpoints without creating orders or payments
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 6
        env:
          RUN_SC_DELIVERY_SMOKE: '1'
        run: node --experimental-strip-types --test --test-name-pattern='live Greenville' tests/sc-delivery.test.mjs

      - name: Save public delivery verification evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: sc-delivery-live-verification
          path: test-results/sc-delivery-live.json
          if-no-files-found: ignore
          retention-days: 7
