name: Downstate public page smoke

on:
  workflow_dispatch:

jobs:
  page-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public pages
        shell: bash
        run: |
          base="https://fpr-nyc-production.up.railway.app"
          for i in {1..30}; do
            if curl -fsSL --max-time 10 "$base/health" | grep -q '"ok":true'; then
              break
            fi
            sleep 5
          done
          curl -fsSL --max-time 20 "$base/" | grep -q 'Party rentals delivered across Riverdale'
          curl -fsSL --max-time 20 "$base/" | grep -q 'Riverdale Backyard 32'
          curl -fsSL --max-time 20 "$base/packages/" | grep -q 'Signature Wedding 80'
          curl -fsSL --max-time 20 "$base/riverdale/tent-rentals/" | grep -q 'Tent Rentals in Riverdale'
          curl -fsSL --max-time 20 "$base/riverdale/bounce-house-rentals/" | grep -q 'Bounce House Rentals in Riverdale'
          curl -fsSL --max-time 20 "$base/yonkers/tent-rentals/" | grep -q 'Tent Rentals in Yonkers'
          curl -fsSL --max-time 20 "$base/bronx/tent-rentals/" | grep -q 'Tent Rentals in The Bronx'
          sitemap="$(curl -fsSL --max-time 20 "$base/sitemap.xml")"
          printf '%s' "$sitemap" | grep -q '/riverdale/tent-rentals/'
          printf '%s' "$sitemap" | grep -q '/packages/'
          count="$(printf '%s' "$sitemap" | grep -o '<url>' | wc -l | tr -d ' ')"
          test "$count" = "21"
          curl -fsSL --max-time 20 -o /dev/null https://www.friendlypartyrental.com/api/item-image/20x20-pole-tent
          curl -fsSL --max-time 20 -o /dev/null https://www.friendlypartyrental.com/api/item-image/white-resin-chair-pad
          curl -fsSL --max-time 20 -o /dev/null https://www.friendlypartyrental.com/api/item-image/crayon-bounce-house
          curl -fsSL --max-time 20 -o /dev/null https://www.friendlypartyrental.com/images/desktop-hero-tent-reception.jpg
          echo "Public page smoke passed with $count sitemap URLs."
