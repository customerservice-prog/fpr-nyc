name: Incomplete Orders Follow-up

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call incomplete orders endpoint
        run: |
          curl -f -X GET https://fpr-nyc-production.up.railway.app/api/cron/incomplete-orders -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
