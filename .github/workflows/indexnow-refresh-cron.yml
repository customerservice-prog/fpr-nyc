name: IndexNow Live Catalog Refresh

on:
  push:
    paths:
      - '.github/oidc-cron-smoke'
  schedule:
    - cron: '25 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Submit current NYC searchable URLs to IndexNow
        run: |
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fpr-nyc-cron" | jq -r '.value')"

          test -n "$OIDC_TOKEN"

          test "$OIDC_TOKEN" != "null"

          curl -f -X GET https://fpr-nyc-production.up.railway.app/api/cron/indexnow -H "Authorization: Bearer $OIDC_TOKEN"
