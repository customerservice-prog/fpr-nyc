name: IndexNow Live Catalog Refresh

on:
  push:
    paths:
      - '.github/cron-smoke-test'
  schedule:
    - cron: '25 14 * * *'
  workflow_dispatch: {}

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Submit current NYC searchable URLs to IndexNow
        run: |
          curl -f -X GET https://fpr-nyc-production.up.railway.app/api/cron/indexnow -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
