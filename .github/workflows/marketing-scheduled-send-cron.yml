name: Marketing Scheduler Diagnostic
# Railway owns the recurring five-minute schedule. This is a manual diagnostic only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the validated scheduler check
        env:
          MARKETING_CRON_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
          MARKETING_SITE_ORIGIN: https://fpr-nyc-production.up.railway.app
        run: node scripts/marketing-review-cron.mjs
