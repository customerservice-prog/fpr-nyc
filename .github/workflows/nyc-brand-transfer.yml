name: NYC approved brand transfer
on:
  push:
    branches: [fix/nyc-approved-branding-20260929]
    paths: [.github/workflows/nyc-brand-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nyc-approved-branding-20260929
      - name: Import and validate unchanged owner PNG
        env:
          SOURCE_URL: 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-c110-81f5-85a8-605cfa7cc285/raw?se=2026-09-29T22%3A35%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=01a0ef3d-8a4f-711f-8abd-f5b3c2c5080d&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T19%3A48%3A05Z&ske=2026-09-30T19%3A48%3A05Z&sks=b&skv=2026-02-06&sig=5MtHjc4iRUoQHjoyqkyYdfonieli6vHp07RC99gjNBA%3D'
          COPY_URL: 'https://lh7-rt.googleusercontent.com/docsz/AD_4nXcZ7HknX4M2WxCaatZ7S3_MS2TyLUxofLwpeqcOBHx0q8KNe8IyuFR77XvO20ESIOaJwsbHrBykQ9yFv9RJESH-uLx7KdP963MWUovDmTz-9KkU-vc77OTuLXeZLtdEzTqpgZIPfLtBLxWZng5ruDUGIcSWUtNMvGVByr9BLeMPotIZ=s2048?key=RPsuIhOc72w9FZTeG-KDlA'
        run: |
          python3 - <<'PY'
          import os, urllib.request, hashlib, struct, zlib, json
          from pathlib import Path
          expected = '37bb5f00906e5b71aba2e3d63715b71f1e4b29b5b01e8e40b5f1d27719d1b253'
          data = None
          for key in ('SOURCE_URL', 'COPY_URL'):
              try:
                  with urllib.request.urlopen(os.environ[key], timeout=40) as response:
                      candidate = response.read(3000000)
                  print(key, 'bytes',len(candidate),'sha256',hashlib.sha256(candidate).hexdigest())
                  if hashlib.sha256(candidate).hexdigest() == expected:
                      data = candidate
                      break
              except Exception as exc:
                  print(key, type(exc).__name__)
          assert data is not None and len(data) == 2428349, 'Original image unavailable; do not substitute artwork'
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          offset = 8
          compressed = bytearray()
          saw_end = False
          while offset < len(data):
              length = struct.unpack('>I', data[offset:offset+4])[0]
              kind = data[offset+4:offset+8]
              payload = data[offset+8:offset+8+length]
              assert len(payload) == length
              crc = struct.unpack('>I', data[offset+8+length:offset+12+length])[0]
              assert zlib.crc32(kind + payload) & 0xffffffff == crc, 'PNG CRC error'
              if kind == b'IHDR':
                  assert struct.unpack('>II',payload[:8]) == (1774,887)
              if kind == b'IDAT': compressed.extend(payload)
              offset += length + 12
              if kind == b'IEND':
                  saw_end = True
                  break
          assert saw_end and offset == len(data), 'Incomplete PNG'
          assert zlib.decompress(compressed)
          p=Path('public/brand/friendly-party-rental-nyc-20260929-original.png')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(data)
          p.with_suffix('.json').write_text(json.dumps({'source':'Owner supplied September 29 logo','sha256':expected,'bytes':len(data),'width':1774,'height':887,'transformed':False},indent=2)+'\n')
          print('Exact original verified, all PNG chunks and compressed image complete')
          PY
      - name: Commit exact asset to isolated branch only
        run: |
          git config user.name 'NYC Branding Import'
          git config user.email 'actions@users.noreply.github.com'
          git add public/brand/friendly-party-rental-nyc-20260929-original.*
          if ! git diff --cached --quiet; then
            git commit -m 'Store complete approved yellow-magenta NYC logo, checksum verified'
            git push origin HEAD:fix/nyc-approved-branding-20260929
          fi
      - name: Package source for local review
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess,tarfile
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('/tmp/nyc-source.tar.gz','w:gz') as archive:
              for name in paths:
                  if not name or not Path(name).is_file(): continue
                  if name.startswith('public/') and not (name.endswith(('.json','.webmanifest','.js')) or '20260929-original.' in name): continue
                  if name.startswith('.env'): continue
                  archive.add(name,arcname=name)
          assert Path('/tmp/nyc-source.tar.gz').stat().st_size>500000
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyc-source-review
          path: /tmp/nyc-source.tar.gz
          retention-days: 1
