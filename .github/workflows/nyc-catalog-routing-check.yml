name: NYC catalog routing check
on:
  push:
    branches: [fix/nyc-catalog-routing-20260929]
    paths: [.github/workflows/nyc-catalog-routing-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read existing NYC catalogs only
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, concurrent.futures, json, time
          hosts=['https://friendlypartyrentalnyc.com','https://fpr-nyc-full-preview-production.up.railway.app']
          def check(url):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NYC-owner-read-only-catalog-QA'})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      raw=r.read(12000000)
                      data=json.loads(raw)
                      result={'url':url,'status':r.status,'finalUrl':r.url,'bytes':len(raw)}
                      if '/categories' in url: result['data']=data
                      else:
                          items=data if isinstance(data,list) else data.get('items',[])
                          result['itemCount']=len(items)
                          result['items']=[{k:x.get(k) for k in ['name','slug','category','status','quantity','cost','displayToCustomer']} for x in items[:15]]
                          result['categorySlugs']=sorted(set(x.get('category',{}).get('slug','') for x in items if x.get('category')))
                      return result
              except Exception as e: return {'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(check,[h+p for h in hosts for p in ['/api/categories','/api/items']]))
          print(json.dumps({'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'results':results},indent=2))
          PY
