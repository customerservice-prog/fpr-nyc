name: NYC catalog routing check
on:
  push:
    branches: [fix/nyc-catalog-routing-20260929]
    paths: [.github/workflows/nyc-catalog-routing-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public catalog endpoints without creating records
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, concurrent.futures, json, re, time
          hosts=['https://friendlypartyrentalnyc.com','https://fpr-nyc-production.up.railway.app']
          paths=['/health','/api/categories','/api/items?search=tent','/category','/category/tent-rentals','/category/table-chair-rentals']
          def check(url):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NYC-owner-read-only-catalog-QA'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read(1500000).decode('utf-8','replace')
                      result={'url':url,'status':r.status,'finalUrl':r.url,'contentType':r.headers.get('Content-Type')}
                      if '/api/' in url or '/health' in url:
                          try:
                              data=json.loads(body)
                              result['shape']=list(data)[:12] if isinstance(data,dict) else type(data).__name__
                              if '/categories' in url: result['data']=data
                              elif '/items' in url:
                                  items=data if isinstance(data,list) else data.get('items',[])
                                  result['itemCount']=len(items)
                                  result['items']=[{k:x.get(k) for k in ['id','name','slug','categoryId','category','status','quantity','cost','displayToCustomer']} for x in items[:12]]
                              else: result['data']=data
                          except Exception: result['body']=body[:500]
                      else:
                          result['title']=re.findall(r'<title>(.*?)</title>',body)[:1]
                          result['categoryLinks']=sorted(set(re.findall(r'href="(/category/[^"?#]+)',body)))
                          result['itemLinks']=sorted(set(re.findall(r'href="(/items/[^"?#]+)',body)))[:12]
                          result['notFoundText']='This page could not be found' in body
                      return result
              except urllib.error.HTTPError as e: return {'url':url,'status':e.code,'body':e.read(150).decode('utf-8','replace')}
              except Exception as e: return {'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(check,[h+p for h in hosts for p in paths]))
          print(json.dumps({'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'results':results},indent=2))
          PY
