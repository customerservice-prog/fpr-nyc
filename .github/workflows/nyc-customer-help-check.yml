name: NYC customer help verification
on:
  push:
    branches: [fix/nyc-customer-help-20260930]
  pull_request:
    branches: [production-nyc-live]
    paths:
      - 'app/(public)/contact_us/**'
      - 'app/(public)/frequently_asked_questions/**'
      - 'components/public/Accordion.tsx'
      - 'lib/nycCustomerHelp.ts'
      - 'lib/nycServiceAreas.ts'
      - 'tests/nyc-customer-help.test.cjs'
      - 'scripts/verify-nyc-customer-help.cjs'
      - '.github/workflows/nyc-customer-help-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nyc-help-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nyc_help_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: nyc_help_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nyc_help_ci -d nyc_help_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nyc_help_ci:disposable_ci_only@localhost:5432/nyc_help_ci
      NEXTAUTH_SECRET: isolated-customer-help-ci-not-a-live-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: https://friendlypartyrentalnyc.com
      PUBLIC_BASE_URL: https://friendlypartyrentalnyc.com
      PUBLIC_INDEXABLE: 'false'
      NYC_ONLINE_PAYMENTS_ENABLED: 'false'
      NYC_DELIVERY_FEES_JSON: '{}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify against latest NYC production without changing it
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'NYC customer help CI'
          git config user.email 'ci@example.invalid'
          git fetch origin production-nyc-live
          echo "Production base: $(git rev-parse origin/production-nyc-live)"
          git merge --no-commit --no-ff origin/production-nyc-live
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Apply migrations only to disposable CI database
        run: npx prisma migrate deploy
      - name: Customer help and existing NYC regressions
        run: node --test tests/nyc-customer-help.test.cjs tests/nyc-domain-isolation.test.cjs tests/nyc-search.test.cjs tests/nyc-tracking-isolation.test.cjs tests/nyc-catalog-routing.test.cjs tests/nyc-delivery.test.cjs
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/nyc-help-browser --no-save --package-lock=false playwright@1.56.1
          /tmp/nyc-help-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser verification with no real submissions
        env:
          NODE_PATH: /tmp/nyc-help-browser/node_modules
        run: |
          npx next start -H 127.0.0.1 -p 3000 > /tmp/nyc-help-app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health > /dev/null && break || sleep 2; done
          node scripts/verify-nyc-customer-help.cjs
      - name: Diagnostics
        if: failure()
        run: cat /tmp/nyc-help-app.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyc-customer-help-local-proof
          path: nyc-help-proof/
          retention-days: 5
          if-no-files-found: ignore
