name: NYC DNS provider diagnostic

on:
  push:
    paths:
      - '.github/dns-provider-smoke'

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve authoritative DNS
        run: |
          echo "NS:"
          dig +short NS friendlypartyrentalnyc.com
          echo "SOA:"
          dig +short SOA friendlypartyrentalnyc.com
          echo "ROOT CNAME:"
          dig +short CNAME friendlypartyrentalnyc.com
          echo "WWW CNAME:"
          dig +short CNAME www.friendlypartyrentalnyc.com
