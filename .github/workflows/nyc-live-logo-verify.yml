name: NYC live logo browser verification
on:
  push:
    branches: [fix/nyc-approved-branding-20260929]
    paths: [.github/workflows/nyc-live-logo-verify.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix /tmp/nyc-browser --no-save --package-lock=false playwright@1.56.1
      - run: /tmp/nyc-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Read-only browser verification with complete diagnostics
        run: |
          mkdir -p /tmp/nyc-verified
          node - <<'JS'
          const {chromium}=require('/tmp/nyc-browser/node_modules/playwright')
          const fs=require('node:fs'),crypto=require('node:crypto')
          const base='https://fpr-nyc-production.up.railway.app'
          const expected='806f9d15f32e34154eb0b8556433ef3ab20e94f707f7019fcddafecbf748f83f'
          ;(async()=>{
            const browser=await chromium.launch({headless:true})
            const report={checkedAt:new Date().toISOString(),base,viewports:[],endpoints:[],customDomain:null,failures:[]}
            const check=(ok,label)=>{if(!ok)report.failures.push(label)}
            try{
              for(const [name,width,height] of [['desktop',1440,1000],['mobile',390,844],['small-mobile',320,740]]){
                const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'reduce'})
                const page=await context.newPage()
                const item={name,viewport:{width,height},requestErrors:[]};report.viewports.push(item)
                page.on('requestfailed',r=>{if(r.url().startsWith(base))item.requestErrors.push({url:r.url(),error:r.failure()?.errorText})})
                try{
                  const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000})
                  item.status=response.status();check(item.status===200,name+' homepage status')
                  await page.waitForTimeout(4500)
                  const measure=async img=>{
                    await img.decode();const r=img.getBoundingClientRect()
                    return {src:img.currentSrc,width:img.naturalWidth,height:img.naturalHeight,renderedWidth:r.width,renderedHeight:r.height,left:r.left,right:r.right}
                  }
                  const header=page.locator('header img:visible').first()
                  await header.waitFor({state:'visible',timeout:20000})
                  item.header=await header.evaluate(measure)
                  const h=item.header
                  check(h.width===1774&&h.height===887,name+' full image dimensions')
                  check(Math.abs(h.renderedWidth/h.renderedHeight-2)<0.02,name+' header 2:1 ratio')
                  check(h.left>=0&&h.right<=width+1,name+' logo inside viewport')
                  const asset=await context.request.get(h.src)
                  item.logoHash=crypto.createHash('sha256').update(await asset.body()).digest('hex')
                  check(asset.status()===200&&item.logoHash===expected,name+' approved asset bytes')
                  item.documentWidth=await page.evaluate(()=>document.documentElement.scrollWidth)
                  item.overflow=item.documentWidth>width
                  check(!item.overflow,name+' horizontal overflow')
                  if(item.overflow)item.overflowElements=await page.evaluate(()=>Array.from(document.querySelectorAll('body *')).map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {tag:e.tagName,className:typeof e.className==='string'?e.className:'',text:e.textContent?.trim().slice(0,100),left:r.left,right:r.right,width:r.width,display:s.display,position:s.position,overflowX:s.overflowX,whiteSpace:s.whiteSpace,minWidth:s.minWidth}}).filter(e=>e.display!=='none'&&e.width>0&&(e.right>innerWidth+1||e.left< -1)).slice(0,70))
                  await page.screenshot({path:'/tmp/nyc-verified/'+name+'-header.png'})
                  const footer=page.locator('footer img:visible').first()
                  await footer.scrollIntoViewIfNeeded();item.footer=await footer.evaluate(measure)
                  check(item.footer.width===1774&&item.footer.height===887,name+' footer original dimensions')
                  check(Math.abs(item.footer.renderedWidth/item.footer.renderedHeight-2)<0.02,name+' footer ratio')
                  await page.screenshot({path:'/tmp/nyc-verified/'+name+'-footer.png'})
                  if(width<768){await page.evaluate(()=>scrollTo(0,0));await page.getByRole('button',{name:'Open menu',exact:true}).click();await page.getByRole('button',{name:'Close menu',exact:true}).waitFor({state:'visible'});await page.keyboard.press('Escape');await page.getByRole('button',{name:'Close menu',exact:true}).waitFor({state:'hidden'});item.menu='opened and closed with Escape'}
                }catch(e){item.error=e.message.split('\n').slice(0,3).join(' ');report.failures.push(name+': '+item.error);await page.screenshot({path:'/tmp/nyc-verified/'+name+'-failure.png'}).catch(()=>{})}
                await context.close()
              }
              const context=await browser.newContext()
              for(const endpoint of ['/health','/category/tent-rentals','/admin/login','/api/driver-icon-512','/api/driver-icon-maskable']){
                try{const r=await context.request.get(base+endpoint,{timeout:25000});report.endpoints.push({endpoint,status:r.status(),finalUrl:r.url(),contentType:r.headers()['content-type']});check(r.status()===200,endpoint+' status')}catch(e){report.endpoints.push({endpoint,error:e.message.split('\n')[0]});report.failures.push(endpoint+' request failed')}
              }
              try{const r=await context.request.get('https://friendlypartyrentalnyc.com/health',{timeout:15000});report.customDomain={status:r.status(),finalUrl:r.url(),body:(await r.text()).slice(0,300)}}catch(e){report.customDomain={error:e.message.split('\n')[0]}}
              await context.close()
            }finally{console.log(JSON.stringify(report,null,2));fs.writeFileSync('/tmp/nyc-verified/report.json',JSON.stringify(report,null,2));await browser.close()}
            if(report.failures.length)process.exitCode=1
          })().catch(e=>{console.error(e);process.exitCode=1})
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyc-live-logo-verification
          path: /tmp/nyc-verified
          retention-days: 2
