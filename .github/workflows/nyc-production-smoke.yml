name: NYC Production Customer Path Smoke

on:
  push:
    branches: [production-nyc-live]
  schedule:
    - cron: '45 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nyc-production-customer-path
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NYC_BASE: https://friendlypartyrentalnyc.com
      RENTSKETCH_BASE: https://rentsketch.com
    steps:
      - name: Verify NYC storefront and RentSketch customer path
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 25 \
              -H 'User-Agent: FPR-NYC-Production-Smoke/1.0' "$@"
          }

          echo "Waiting for the public NYC storefront to be healthy..."
          healthy=0
          for attempt in $(seq 1 24); do
            if fetch "$NYC_BASE/" -o /tmp/home.html \
              && grep -qi 'Friendly Party Rental NYC' /tmp/home.html; then
              healthy=1
              break
            fi
            sleep 10
          done
          test "$healthy" -eq 1

          echo "Checking launch indexing surfaces..."
          fetch "$NYC_BASE/robots.txt" -o /tmp/robots.txt
          echo "----- robots.txt -----"
          cat /tmp/robots.txt
          echo "----------------------"

          robots_sitemap="$(awk 'BEGIN{IGNORECASE=1} /^Sitemap:/ {print $2; exit}' /tmp/robots.txt)"
          if [ "$robots_sitemap" != "$NYC_BASE/sitemap.xml" ]; then
            echo "::error::NYC robots.txt sitemap is '$robots_sitemap', expected '$NYC_BASE/sitemap.xml'."
            exit 1
          fi
          if grep -Eiq '^Disallow:[[:space:]]*/[[:space:]]*$' /tmp/robots.txt; then
            echo "::error::NYC robots.txt is blocking the entire site."
            exit 1
          fi

          fetch "$NYC_BASE/sitemap.xml" -o /tmp/sitemap.xml
          grep -Fq "$NYC_BASE/design-your-event" /tmp/sitemap.xml
          grep -Fq "$NYC_BASE/category/tent-rentals" /tmp/sitemap.xml

          echo "Checking live NYC catalog API..."
          fetch "$NYC_BASE/api/items" -o /tmp/items.json
          jq -e '.items | type == "array" and length > 0' /tmp/items.json >/dev/null
          jq -e '[.items[] | select(.slug != null and .name != null and .cost != null)] | length > 0' /tmp/items.json >/dev/null

          echo "Checking NYC event designer page..."
          fetch "$NYC_BASE/design-your-event" -o /tmp/designer.html
          grep -qi 'RentSketch' /tmp/designer.html
          grep -qi 'friendly party rental nyc' /tmp/designer.html

          echo "Checking RentSketch dedicated NYC tenant entry points..."
          fetch "$RENTSKETCH_BASE/designer/?tenant=friendly-nyc&source=production_smoke" -o /tmp/rentsketch-designer.html
          grep -Eqi 'RentSketch|Event Designer|Design' /tmp/rentsketch-designer.html

          fetch "$RENTSKETCH_BASE/my-event/?tenant=friendly-nyc&mode=order" -o /tmp/rentsketch-order.html
          grep -Eqi 'order|first name|RentSketch|event' /tmp/rentsketch-order.html

          echo "Checking NYC booking-return route renders safely without creating an order..."
          fetch "$NYC_BASE/design-your-event/book" -o /tmp/booking-return.html
          grep -Eqi 'RentSketch|checkout|design|layout' /tmp/booking-return.html

          echo "NYC production customer-path smoke passed."
