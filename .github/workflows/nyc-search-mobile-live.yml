name: NYC search mobile live acceptance
on:
  push:
    branches: [verify/nyc-search-mobile-live-20260930]
    paths: [.github/workflows/nyc-search-mobile-live.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_PATH: /tmp/nyc-browser/node_modules
      NYC_QA_ORIGIN: https://friendlypartyrentalnyc.com
      NYC_QA_ALLOW_LIVE_READS: '1'
      NYC_QA_OUTPUT: /tmp/nyc-search-live-proof
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4009544d9e43ebe203aced2174fb3167f20d5d08
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/nyc-browser --no-save --package-lock=false playwright@1.56.1
      - run: /tmp/nyc-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Wait for deployed NYC header and verify public catalog and safety gates
        run: |
          mkdir -p /tmp/nyc-search-live-proof
          node - <<'JS'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const origin = process.env.NYC_QA_ORIGIN
          assert.equal(origin, 'https://friendlypartyrentalnyc.com')
          const report = { expectedCommit: '4009544d9e43ebe203aced2174fb3167f20d5d08', origin, startedAt: new Date().toISOString(), checks: [] }
          const request = (url, options = {}) => fetch(url, { redirect: 'manual', signal: AbortSignal.timeout(20000), ...options })
          async function checkPage(path) {
            const response = await request(origin + path)
            assert.equal(response.status, 200, path)
            report.checks.push({ path, status: response.status })
            return response
          }
          ;(async () => {
            let deployed = false
            for (let attempt = 0; attempt < 40; attempt++) {
              try {
                const r = await request(origin + '/?qa=nyc-search-release')
                if (r.status === 200 && (await r.text()).includes('Find rental equipment')) { deployed = true; break }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 5000))
            }
            assert.ok(deployed, 'New NYC search header did not reach production')
            for (const path of ['/health', '/', '/category', '/admin/login', '/checkout', '/contact_us', '/frequently_asked_questions']) await checkPage(path)
            const categoriesResponse = await checkPage('/api/categories')
            const payload = await categoriesResponse.json()
            const categories = Array.isArray(payload) ? payload : payload.categories
            assert.ok(Array.isArray(categories) && categories.length > 0)
            report.publishedCategoryCount = categories.length
            report.categoryResults = []
            for (const category of categories) {
              assert.ok(typeof category.slug === 'string' && /^[a-zA-Z0-9_-]+$/.test(category.slug), 'Valid category slug')
              const slug = encodeURIComponent(category.slug)
              const page = await request(origin + '/category/' + slug)
              const api = await request(origin + '/api/categories/' + slug)
              assert.equal(page.status, 200, 'Category page ' + slug)
              assert.equal(api.status, 200, 'Category API ' + slug)
              report.categoryResults.push({ slug: category.slug, pageStatus: page.status, apiStatus: api.status })
            }
            const itemsPayload = await (await checkPage('/api/items')).json()
            const items = Array.isArray(itemsPayload) ? itemsPayload : itemsPayload.items
            assert.ok(Array.isArray(items))
            report.publishedItemCount = items.length
            const searchPayload = await (await checkPage('/api/items?search=tent')).json()
            report.realTentSearchCount = (Array.isArray(searchPayload) ? searchPayload : searchPayload.items).length
            const redirect = await request('https://www.friendlypartyrentalnyc.com/category/tent-rentals?qa=nyc-search&keep=1')
            assert.equal(redirect.status, 308)
            assert.equal(redirect.headers.get('location'), origin + '/category/tent-rentals?qa=nyc-search&keep=1')
            report.wwwRedirect = { status: redirect.status, location: redirect.headers.get('location') }
            const robots = await (await checkPage('/robots.txt')).text()
            assert.match(robots, /Disallow:\s*\/\s*(?:\n|$)/)
            report.publicIndexingDisabled = true
            report.paymentStatus = await (await checkPage('/api/payments/status')).json()
            assert.equal(report.paymentStatus.onlinePaymentsAvailable, false)
            assert.equal(report.paymentStatus.checks.onlinePaymentsSwitchOn, false)
            report.status = 'passed'
          })().catch(error => { report.status = 'failed'; report.error = error.stack; process.exitCode = 1 }).finally(() => {
            report.finishedAt = new Date().toISOString()
            fs.writeFileSync('/tmp/nyc-search-live-proof/live-acceptance.json', JSON.stringify(report, null, 2))
            console.log(JSON.stringify(report, null, 2))
          })
          JS
      - name: Actual production React search and mobile acceptance with browser-only mock responses
        run: node tests/nyc-search-ui.cjs
      - name: Capture freshly opened mobile menu and desktop search error without saving any records
        run: |
          node - <<'JS'
          const { chromium } = require('playwright')
          const fs = require('node:fs')
          ;(async () => {
            const browser = await chromium.launch()
            try {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 }, reducedMotion: 'reduce', serviceWorkers: 'block' })
              await context.route('**/*', route => ['GET','HEAD'].includes(route.request().method()) ? route.continue() : route.fulfill({ status: 204, body: '' }))
              const page = await context.newPage()
              await page.goto(process.env.NYC_QA_ORIGIN, { waitUntil: 'domcontentloaded' })
              await page.getByRole('button', { name: 'Open menu', exact: true }).click()
              await page.getByRole('dialog', { name: 'Mobile navigation', exact: true }).waitFor({ state: 'visible' })
              await page.screenshot({ path: '/tmp/nyc-search-live-proof/mobile-menu-open.png' })
              await page.keyboard.press('Escape')
              await page.getByRole('button', { name: 'Search', exact: true }).click()
              await page.route(url => url.pathname === '/api/items' && url.searchParams.has('search'), route => route.fulfill({ status: 503, json: { error: 'Browser-only simulated failure' } }))
              await page.getByRole('dialog').getByRole('searchbox').fill('tents')
              await page.getByRole('alert').waitFor({ state: 'visible' })
              await page.screenshot({ path: '/tmp/nyc-search-live-proof/mobile-search-retry-browser-simulation.png' })
              await context.close()
            } finally { await browser.close() }
          })().catch(error => { console.error(error); process.exitCode = 1 })
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyc-search-mobile-live-proof
          path: /tmp/nyc-search-live-proof
          retention-days: 7
