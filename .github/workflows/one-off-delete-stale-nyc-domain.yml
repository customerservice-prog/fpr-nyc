name: One-off delete stale NYC Railway domain

on:
  push:
    branches:
      - ops/delete-stale-nyc-domain-20261002
    paths:
      - '.github/workflows/one-off-delete-stale-nyc-domain.yml'

permissions:
  contents: read

jobs:
  delete-domain:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Delete only stale NYC custom domain
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ] && [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "::error::No Railway token secret is configured in this repository."
            exit 2
          fi
          railway domain delete 184f38a3-3e95-4c7a-b441-65fb358be3fe \
            --project 58509c3e-6113-4eb3-9f57-2d6f9cf64002 \
            --service 296831e0-0015-4e5e-b221-c59176ebb66d \
            --environment cb808a6d-bc11-4263-890c-018cd2d9b41a \
            --yes --json
          railway domain list \
            --project 58509c3e-6113-4eb3-9f57-2d6f9cf64002 \
            --service 296831e0-0015-4e5e-b221-c59176ebb66d \
            --environment cb808a6d-bc11-4263-890c-018cd2d9b41a \
            --json
