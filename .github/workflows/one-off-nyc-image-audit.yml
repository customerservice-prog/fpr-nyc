name: One-off NYC image audit

on:
  push:
    branches:
      - audit/nyc-live-lighthouse-20261003
    paths:
      - '.github/workflows/one-off-nyc-image-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Largest public assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Largest public files:"
          find public -type f -printf '%s %p\n' | sort -nr | head -40
          echo
          echo "Hero:"
          stat -c '%s %n' public/images/sc-event-reception.jpg
          file public/images/sc-event-reception.jpg
