name: One-off NYC live Lighthouse

on:
  push:
    branches:
      - ops/nyc-live-lighthouse-20261002
    paths:
      - '.github/workflows/one-off-nyc-lighthouse.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose live NYC LCP
        shell: bash
        run: |
          set -euo pipefail
          npm install -g lighthouse@12
          for url in \
            "https://friendlypartyrentalnyc.com/" \
            "https://friendlypartyrentalnyc.com/category/tent-rentals" \
            "https://friendlypartyrentalnyc.com/design-your-event"
          do
            name="$(echo "$url" | sed 's#https://friendlypartyrentalnyc.com/##;s#[^a-zA-Z0-9]#-#g;s#^$#home#')"
            lighthouse "$url" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="/tmp/$name.json" --only-categories=performance,seo --quiet
            node - "$url" "/tmp/$name.json" <<'NODE'
          const fs=require('fs')
          const [url,path]=process.argv.slice(2)
          const r=JSON.parse(fs.readFileSync(path,'utf8'))
          const a=r.audits
          const req=(a['network-requests']?.details?.items||[])
            .filter(x=>x.resourceType==='Image')
            .sort((x,y)=>(y.transferSize||0)-(x.transferSize||0))
            .slice(0,12)
            .map(x=>({url:x.url,transferKB:Math.round((x.transferSize||0)/1024),resourceKB:Math.round((x.resourceSize||0)/1024),mimeType:x.mimeType,status:x.statusCode}))
          console.log(JSON.stringify({
            url,
            performance:Math.round((r.categories.performance?.score||0)*100),
            LCP:a['largest-contentful-paint']?.displayValue,
            TBT:a['total-blocking-time']?.displayValue,
            lcpElement:a['largest-contentful-paint-element']?.details?.items||[],
            lcpPhases:a['lcp-phases']?.details?.items||a['lcp-breakdown-insight']?.details?.items||[],
            serverResponse:a['server-response-time']?.displayValue,
            images:req,
            imageSavings:{
              modern:a['modern-image-formats']?.displayValue,
              responsive:a['uses-responsive-images']?.displayValue,
              encoding:a['uses-optimized-images']?.displayValue,
            },
            js:{
              unused:a['unused-javascript']?.displayValue,
              bootup:a['bootup-time']?.displayValue,
              mainThread:a['mainthread-work-breakdown']?.displayValue,
            }
          },null,2))
          NODE
          done
