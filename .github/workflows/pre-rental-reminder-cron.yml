name: Pre-Rental Reminders

on:
  schedule:
    - cron: '10 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call pre-rental reminder endpoint
        run: |
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fpr-nyc-cron" | jq -r '.value')"

          test -n "$OIDC_TOKEN"

          test "$OIDC_TOKEN" != "null"

          curl -f -X GET https://fpr-nyc-production.up.railway.app/api/cron/pre-rental-reminder -H "Authorization: Bearer $OIDC_TOKEN"
