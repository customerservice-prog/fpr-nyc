name: Resend DNS diagnostic

on:
  push:
    paths:
      - '.github/resend-dns-smoke'

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Check Resend DNS
        run: |
          echo "DKIM TXT:"
          dig +short TXT resend._domainkey.friendlypartyrentalnyc.com
          echo "SPF MX:"
          dig +short MX send.friendlypartyrentalnyc.com
          echo "SPF TXT:"
          dig +short TXT send.friendlypartyrentalnyc.com
          echo "RSEND CNAME:"
          dig +short CNAME rsend.friendlypartyrentalnyc.com
