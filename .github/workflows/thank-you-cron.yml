name: Thank You Emails

on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch: {}

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call thank you endpoint
        run: |
          curl -f -X GET https://fpr-nyc-production.up.railway.app/api/cron/thank-you -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
